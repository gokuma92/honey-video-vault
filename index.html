<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f0"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="./icon-192.png"><title>꿀곰 영상 보관함</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#362c28;background:#fff9f0}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #eee2d6;position:sticky;top:0;z-index:5} .wrap{max-width:1100px;margin:auto;padding:18px 18px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.muted{color:#83766c;font-size:13px}.btn{border:1px solid #e9d9c8;border-radius:12px;padding:10px 14px;background:white;color:#41352e;font-weight:700}.primary{background:#f7b849;border-color:#f7b849;color:#392b14}.btn:hover{filter:brightness(.97)}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:20px 0}.stat{background:white;border:1px solid #f0e5d8;border-radius:17px;padding:15px}.stat strong{display:block;font-size:25px;margin-top:4px}.formbox{background:white;border:1px solid #efdfcf;padding:18px;border-radius:19px;margin-bottom:20px}.formgrid{display:grid;grid-template-columns:2fr 1fr;gap:12px}label{font-size:13px;font-weight:700;display:block;margin:0 0 6px}input,select,textarea{border:1px solid #e5d8ca;background:#fffdfa;border-radius:11px;width:100%;padding:11px;outline-color:#d99a32}textarea{resize:vertical;min-height:70px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:165px}.toolbar select{width:auto;max-width:100%}.chiprow{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.chip{white-space:nowrap;background:#fff;border:1px solid #e7d8c6;border-radius:40px;padding:8px 12px;color:#51463d;font-size:13px}.chip.active{background:#483729;color:#fff;border-color:#483729}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px;margin-top:18px}.video{background:white;border:1px solid #eee0d1;border-radius:17px;overflow:hidden;min-width:0}.thumb{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(145deg,#f7dbac,#efd8c8);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;background:#3b2c27bc;border-radius:100px;padding:12px 17px;border:0;font-size:19px}.body{padding:13px}.title{font-weight:800;line-height:1.5;overflow-wrap:anywhere}.meta{font-size:12px;color:#87766a;margin-top:5px}.note{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:#68584c;max-height:70px;overflow:hidden}.cardactions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.cardactions .btn{padding:6px 9px;font-size:12px}.empty{text-align:center;border:1px dashed #d8c2a9;background:white;padding:40px 15px;border-radius:18px;margin-top:18px}.hidden{display:none!important}.small{font-size:12px}.warning{background:#fff2d9;border-radius:10px;padding:9px;color:#71522b;font-size:12px;margin-top:10px}dialog{border:0;border-radius:18px;padding:0;max-width:min(700px,94vw);width:100%;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#0009}.dialogbody{padding:18px}.player{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:black}.footer{color:#908174;text-align:center;font-size:12px;padding:24px 10px}@media(max-width:560px){.wrap{padding:14px}.brand{font-size:18px}.formgrid{grid-template-columns:1fr}.stat{padding:12px}.stat strong{font-size:22px}.toolbar select{flex:1}.top .btn{font-size:13px;padding:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:10px}.title{font-size:13px}.thumb{aspect-ratio:4/3}.cardactions .btn{font-size:11px;padding:5px 7px}}@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap top"><div><div class="brand">🍯 꿀곰 영상 보관함</div><div class="muted">릴스 · 쇼츠 · 유튜브 한곳에</div></div><button class="btn" id="exportBtn">⬇ 백업</button></div></header>
<main class="wrap"><div class="statrow"><div class="stat"><span class="muted">전체 영상</span><strong id="total">0</strong></div><div class="stat"><span class="muted">즐겨찾기</span><strong id="favorites">0</strong></div><div class="stat"><span class="muted">나중에 보기</span><strong id="later">0</strong></div></div>
<section class="formbox"><div class="top" style="margin-bottom:13px"><b id="formTitle">＋ 새 영상 저장</b><button class="btn" id="importBtn">백업 가져오기</button><input id="importInput" type="file" accept="application/json,.json" hidden></div><form id="addForm" class="formgrid"><div class="full"><label for="url">영상 링크 *</label><input id="url" type="url" placeholder="https://www.youtube.com/shorts/… 또는 인스타 릴스 링크" required></div><div><label for="title">제목 (직접 입력 또는 자동 생성)</label><input id="title" placeholder="예: 다음에 따라 할 다꾸"></div><div><label for="category">카테고리</label><input id="category" list="categoryList" placeholder="예: 다꾸"><datalist id="categoryList"><option>다꾸</option><option>요리</option><option>공부</option><option>여행</option><option>운동</option><option>기타</option></datalist></div><div class="full"><label for="notes">나만의 메모</label><textarea id="notes" placeholder="저장한 이유, 따라 해볼 것 등"></textarea></div><div class="full actions"><button type="button" class="btn hidden" id="cancelEdit">수정 취소</button><button type="submit" class="btn primary" id="submitBtn">영상 저장하기</button></div></form><div class="warning">🔒 첫 버전은 이 기기의 브라우저에만 저장돼요. 다른 기기와 자동 동기화되지 않으므로 백업 파일을 보관해 주세요.</div></section>
<section><div class="toolbar"><input id="search" placeholder="🔎 제목·카테고리·메모 검색" aria-label="검색"><select id="platform" aria-label="플랫폼 필터"><option value="all">모든 플랫폼</option><option value="YouTube">YouTube</option><option value="Instagram">Instagram</option><option value="TikTok">TikTok</option><option value="기타">기타</option></select><select id="status" aria-label="영상 상태"><option value="all">전체 상태</option><option value="favorite">❤️ 즐겨찾기</option><option value="later">🔖 나중에 보기</option><option value="watched">✅ 시청 완료</option></select><select id="sort" aria-label="정렬"><option value="new">최신 저장순</option><option value="old">오래된순</option><option value="title">제목순</option></select></div><div class="chiprow" id="categories"></div><div id="videos" class="grid"></div><div id="empty" class="empty hidden"><div style="font-size:38px">🎞️</div><b>아직 해당하는 영상이 없어요.</b><p class="muted">위에서 영상 링크를 등록해 보세요!</p></div></section></main>
<footer class="footer">꿀곰 영상 보관함 · 링크를 저장하는 개인용 첫 번째 버전</footer>
<dialog id="modal"><div class="dialogbody"><div class="top"><b id="modalTitle">영상 보기</b><button class="btn" id="closeModal">닫기 ✕</button></div><div id="playerArea" style="margin-top:14px"></div><p class="muted">플레이어가 제한되면 원본 사이트에서 시청해 주세요.</p><a class="btn primary" target="_blank" rel="noopener noreferrer" id="originalLink" style="display:inline-block;text-decoration:none">원본 영상 열기 ↗</a></div></dialog>
<script>
'use strict';
const KEY='honey-video-vault-v1';let items=[];let editing=null;let activeCat='전체';
const $=id=>document.getElementById(id);
const storage=()=>{try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('기기에 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.');return false}};
try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))items=stored.filter(v=>v&&typeof v.url==='string')}catch(e){alert('저장된 데이터가 손상되었어요. 백업 파일이 있다면 가져와 주세요.')}
function parseUrl(raw){let u;try{u=new URL(raw.trim());if(!['http:','https:'].includes(u.protocol))throw 0}catch(e){throw Error('올바른 http/https 영상 링크를 입력해 주세요.')}
const h=u.hostname.toLowerCase().replace(/^www\./,'');let platform='기타',yt=null;
if(h==='youtu.be'||h==='youtube.com'||h==='m.youtube.com'||h==='youtube-nocookie.com'){platform='YouTube';if(h==='youtu.be')yt=u.pathname.split('/')[1];else if(u.pathname==='/watch')yt=u.searchParams.get('v');else {let m=u.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/);if(m)yt=m[1]}if(yt&&!/^[a-zA-Z0-9_-]{11}$/.test(yt))yt=null}
else if(h==='instagram.com'||h==='m.instagram.com')platform='Instagram';else if(h==='tiktok.com'||h==='vm.tiktok.com'||h==='vt.tiktok.com')platform='TikTok';
return {url:u.href,platform,yt};}
const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2);
function render(){const q=$('search').value.trim().toLowerCase(),pf=$('platform').value,st=$('status').value;const cats=['전체',...new Set(items.map(x=>x.category||'미분류'))];if(!cats.includes(activeCat))activeCat='전체';$('categories').innerHTML=cats.map(c=>`<button class="chip ${c===activeCat?'active':''}" data-category="${safe(c)}">${safe(c)}</button>`).join('');$('total').textContent=items.length;$('favorites').textContent=items.filter(x=>x.favorite).length;$('later').textContent=items.filter(x=>x.later&&!x.watched).length;
let data=items.filter(x=>(activeCat==='전체'||(x.category||'미분류')===activeCat)&&(pf==='all'||x.platform===pf)&&(st==='all'||(st==='favorite'&&x.favorite)||(st==='later'&&x.later&&!x.watched)||(st==='watched'&&x.watched))&&[x.title,x.category,x.notes,x.platform].join(' ').toLowerCase().includes(q));const sort=$('sort').value;data.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'ko'):sort==='old'?a.created-b.created:b.created-a.created);
$('empty').classList.toggle('hidden',data.length>0);$('videos').innerHTML=data.map(x=>{const parsed=parseUrl(x.url),thumb=parsed.yt?`<img loading="lazy" referrerpolicy="no-referrer" src="https://i.ytimg.com/vi/${parsed.yt}/hqdefault.jpg" alt="영상 썸네일">`:`<div style="font-size:42px">${x.platform==='Instagram'?'📷':x.platform==='TikTok'?'🎵':'🎬'}</div>`;return `<article class="video"><div class="thumb">${thumb}<button class="play" data-action="play" data-id="${safe(x.id)}" aria-label="영상 열기">▶</button></div><div class="body"><div class="title">${safe(x.title)}</div><div class="meta">${safe(x.platform)} · ${safe(x.category||'미분류')} ${x.watched?'· ✅ 시청 완료':''}</div>${x.notes?`<p class="note">${safe(x.notes)}</p>`:''}<div class="cardactions"><button class="btn" data-action="favorite" data-id="${safe(x.id)}">${x.favorite?'❤️':'🤍'}</button><button class="btn" data-action="later" data-id="${safe(x.id)}">${x.later?'🔖':'▢'} 보관</button><button class="btn" data-action="watched" data-id="${safe(x.id)}">${x.watched?'↩ 다시보기':'✓ 시청'}</button><button class="btn" data-action="edit" data-id="${safe(x.id)}">수정</button><button class="btn" data-action="delete" data-id="${safe(x.id)}">삭제</button></div></div></article>`}).join('')}
function resetForm(){editing=null;$('addForm').reset();$('formTitle').textContent='＋ 새 영상 저장';$('submitBtn').textContent='영상 저장하기';$('cancelEdit').classList.add('hidden')}
$('addForm').addEventListener('submit',e=>{e.preventDefault();let info;try{info=parseUrl($('url').value)}catch(err){alert(err.message);return}if(items.some(x=>x.url===info.url&&x.id!==editing)){alert('이미 저장한 영상 링크예요.');return}const old=items.find(x=>x.id===editing);const v={id:editing||uid(),url:info.url,platform:info.platform,title:$('title').value.trim()||`${info.platform} 영상`,category:$('category').value.trim()||'미분류',notes:$('notes').value.trim(),favorite:old?.favorite||false,later:old?.later??true,watched:old?.watched||false,created:old?.created||Date.now()};items=editing?items.map(x=>x.id===editing?v:x):[v,...items];if(storage()){resetForm();render()}});
$('cancelEdit').addEventListener('click',resetForm);$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){activeCat=b.dataset.category;render()}});
$('videos').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const x=items.find(v=>v.id===b.dataset.id);if(!x)return;const a=b.dataset.action;if(a==='play'){const p=parseUrl(x.url);$('modalTitle').textContent=x.title;$('originalLink').href=x.url;$('playerArea').replaceChildren();if(p.yt){const frame=document.createElement('iframe');frame.className='player';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.referrerPolicy='strict-origin-when-cross-origin';frame.allowFullscreen=true;frame.title=x.title;frame.src=`https://www.youtube-nocookie.com/embed/${p.yt}?rel=0`;$('playerArea').append(frame)}else{$('playerArea').innerHTML=`<div class="empty" style="margin:0">${safe(x.platform)} 영상은 원본 페이지에서 열어 주세요.<br><span class="muted">접근 제한이나 로그인 상태에 따라 사이트 내 재생이 불가능할 수 있어요.</span></div>`}$('modal').showModal();return}
if(a==='delete'){if(confirm('이 영상을 보관함에서 삭제할까요?')){items=items.filter(v=>v.id!==x.id);storage();render()}return}if(a==='edit'){$('url').value=x.url;$('title').value=x.title;$('category').value=x.category;$('notes').value=x.notes;editing=x.id;$('formTitle').textContent='✏ 영상 수정';$('submitBtn').textContent='수정 저장';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});return}if(a==='favorite')x.favorite=!x.favorite;if(a==='later')x.later=!x.later;if(a==='watched')x.watched=!x.watched;storage();render()});
$('closeModal').addEventListener('click',()=>$('modal').close());$('modal').addEventListener('close',()=>$('playerArea').replaceChildren());
for(const id of ['search','platform','status','sort'])$(id).addEventListener(id==='search'?'input':'change',render);
$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'honey-video-vault',version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`video-vault-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('importBtn').addEventListener('click',()=>$('importInput').click());$('importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='honey-video-vault'||!Array.isArray(obj.items))throw Error('이 사이트에서 내보낸 백업 파일이 아니에요.');if(!confirm(`백업 영상 ${obj.items.length}개를 현재 데이터에 합칠까요? 같은 주소는 중복 저장하지 않습니다.`))return;let count=0;for(const row of obj.items){try{const p=parseUrl(row.url);if(items.some(x=>x.url===p.url))continue;items.push({id:uid(),url:p.url,platform:p.platform,title:String(row.title||`${p.platform} 영상`).slice(0,300),category:String(row.category||'미분류').slice(0,80),notes:String(row.notes||'').slice(0,3000),favorite:Boolean(row.favorite),later:Boolean(row.later),watched:Boolean(row.watched),created:Number(row.created)||Date.now()});count++}catch{}}storage();render();alert(`${count}개 영상을 가져왔어요.`)}catch(err){alert(err.message||'파일을 읽지 못했어요.')}finally{e.target.value=''}});
// Allow sharing URLs to an installed future PWA via ?url=; compatible with copy/paste bookmarks.
const params=new URLSearchParams(location.search);
const sharedUrl=params.get('url')||'';const sharedText=params.get('text')||'';const sharedTitle=params.get('title')||'';
const incoming=[sharedUrl,sharedText].filter(Boolean).join(' ');
if(incoming){
 const match=incoming.match(/https?:\/\/[^\s<>"']+/i);
 if(match){$('url').value=match[0].replace(/[),.]+$/,'');if(sharedTitle&&!$('title').value)$('title').value=sharedTitle.slice(0,250);$('formTitle').textContent='🔗 공유받은 영상 저장';}
 else { $('notes').value=sharedText.slice(0,1000); }
 if(match) history.replaceState(null,'',location.pathname);
}
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
